services:
  backend:
    build:
      context: ./src/api
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      NEIS_BASE_URL: ${NEIS_BASE_URL:-https://open.neis.go.kr}
      NEIS_TIMEOUT_SECONDS: ${NEIS_TIMEOUT_SECONDS:-15}
      NEIS_FIXTURE_MODE: ${NEIS_FIXTURE_MODE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mcp:
    build:
      context: ./src/mcp
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      NEIS_BASE_URL: ${NEIS_BASE_URL:-https://open.neis.go.kr}
      NEIS_TIMEOUT_SECONDS: ${NEIS_TIMEOUT_SECONDS:-15}
      NEIS_FIXTURE_MODE: ${NEIS_FIXTURE_MODE:-false}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MCP_PORT:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8001), 3).close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./src/web
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
