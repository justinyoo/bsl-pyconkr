name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Validate internal OpenAPI contract (src/openapi.json)
        run: uvx --from openapi-spec-validator openapi-spec-validator src/openapi.json
      - name: Validate external NEIS OpenAPI contract (data/openapi.json)
        run: uvx --from openapi-spec-validator openapi-spec-validator data/openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: openapi
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Test
        run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: openapi
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    needs: openapi
    defaults:
      run:
        working-directory: src/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    needs: [frontend, backend, mcp]
    env:
      NEIS_FIXTURE_MODE: "true"
      NEIS_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: compose-config
    env:
      # E2E는 실제 NEIS 가용성에 의존하지 않도록 백엔드를 고정 fixture
      # 모드로 실행한다(TRD 12.6). 실제 API 키는 필요하지 않다.
      NEIS_FIXTURE_MODE: "true"
      NEIS_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - name: Start application stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/e2e/package-lock.json
      - name: Install E2E dependencies
        working-directory: src/e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: src/e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: src/e2e
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm test
      - name: Show application logs on failure
        if: failure()
        run: docker compose logs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop application stack
        if: always()
        run: docker compose down -v
