[project]
name = "bsl-mcp"
version = "0.1.0"
description = "급식 배틀 NEIS MCP 서버"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "mcp>=1.29,<2",
    "pydantic-settings>=2.6,<3.0",
]

[project.scripts]
bsl-mcp = "bsl_mcp.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "respx>=0.21,<1.0",
]
