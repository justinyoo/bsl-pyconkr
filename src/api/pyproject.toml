[project]
name = "bsl-api"
version = "0.1.0"
description = "급식 배틀 학교 급식 조회 앱의 FastAPI 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.118,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "respx>=0.21,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
